name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 🧪 Verificar proyecto
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: 📦 Configurar pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: 🛠️ Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: 🦀 Configurar Rust y wasm-pack
        run: bash scripts/setup-rust.sh

      - name: 🔍 Verificar código, pruebas y compilación
        run: pnpm check
