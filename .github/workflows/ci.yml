name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust and wasm-pack
        run: bash scripts/setup-rust.sh

      - name: Check Rust formatting
        run: cargo fmt --manifest-path crates/venn-engine/Cargo.toml --check

      - name: Test Rust engine
        run: cargo test --manifest-path crates/venn-engine/Cargo.toml --locked

      - name: Lint Rust engine
        run: cargo clippy --manifest-path crates/venn-engine/Cargo.toml --locked --all-targets -- -D warnings

      - name: Lint WebAssembly bindings
        run: cargo clippy --manifest-path crates/venn-engine/Cargo.toml --locked --target wasm32-unknown-unknown --lib -- -D warnings

      - name: Build WebAssembly package
        run: pnpm wasm:build

      - name: Check formatting
        run: pnpm format:check

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Lint TypeScript
        run: pnpm lint

      - name: Test application
        run: pnpm test

      - name: Build application
        run: pnpm build
